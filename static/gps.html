<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location check – CS302</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 20px; background: #f8fafc; color: #0f172a; }
  .card { max-width: 440px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 22px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { font-size: 14px; line-height: 1.5; }
  button { width: 100%; padding: 16px; font-size: 17px; font-weight: 700; border: 0; border-radius: 14px; background: #4f46e5; color: #fff; }
  button:active { background: #4338ca; }
  .box { margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; display: none; }
  .ok { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
  .bad { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .info { background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; color: #475569; }
  a { color: #4f46e5; }
</style>
</head>
<body>
<div class="card">
  <h1>📍 Location check</h1>
  <p>This page only checks your location: no camera, no QR code. It measures your distance from the classroom.</p>
  <button id="check">📍 Check my location</button>
  <div id="result" class="box"></div>
  <p style="margin-top:18px"><a href="/?role=student">← Back to check-in</a></p>
</div>

<script>
// Classroom = Ariel University, 500 m (the server's real values are loaded below)
let classroom = { name: "Ariel University", lat: 32.104722, lng: 35.209444, radius: 500 };
fetch("/api/session/active").then(r => r.json()).then(s => {
  classroom = { name: s.classroom_name, lat: s.classroom_lat, lng: s.classroom_lng, radius: s.allowed_radius_meters };
}).catch(() => {});

function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function show(cls, html) {
  const box = document.getElementById("result");
  box.className = "box " + cls;
  box.style.display = "block";
  box.innerHTML = html;
}

function help() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua)) {
    return "iPhone: <b>Settings → Privacy &amp; Security → Location Services</b> = On → <b>Safari Websites</b> = While Using the App. " +
           "Also <b>Settings → Apps → Safari → Location</b> = Ask/Allow. Then close this tab, reopen the link and tap the button again.";
  }
  if (/Android/.test(ua)) {
    return "Android: turn Location on (swipe down), then in Chrome tap the 🔒 icon → Permissions → Location → Allow. " +
           "Still blocked? Settings → Apps → Chrome → Permissions → Location.";
  }
  return "Click the 🔒 icon in the address bar → Location → Allow, then reload.";
}

document.getElementById("check").addEventListener("click", function () {
  if (!window.isSecureContext) {
    show("bad", "❌ This page is opened over <b>http</b>. Location only works on <b>https://</b>. Use the link from <code>python3 server.py --tunnel</code>.");
    return;
  }
  if (!navigator.geolocation) {
    show("bad", "❌ This browser has no location support. Open the link in Safari or Chrome.");
    return;
  }
  // Called directly inside the tap – nothing else runs before it.
  navigator.geolocation.getCurrentPosition(function (pos) {
    const c = pos.coords;
    const d = distanceMeters(classroom.lat, classroom.lng, c.latitude, c.longitude);
    const inside = d <= classroom.radius;
    show(inside ? "ok" : "bad",
      (inside ? "✅ <b>You are inside the radius.</b>" : "❌ <b>You are outside the radius.</b>") +
      "<br>Distance from " + classroom.name + ": <b>" + Math.round(d) + " m</b> (limit " + Math.round(classroom.radius) + " m)" +
      "<br><span class='mono'>lat " + c.latitude.toFixed(6) + ", lng " + c.longitude.toFixed(6) + " · accuracy ±" + Math.round(c.accuracy) + " m</span>");
  }, function (err) {
    const names = { 1: "PERMISSION_DENIED", 2: "POSITION_UNAVAILABLE", 3: "TIMEOUT" };
    show("bad", "❌ <b>The phone did not give a location.</b><br>" +
      (err.code === 1 ? help() : "Turn on Location / GPS and try again near a window.") +
      "<br><br><span class='mono'>error " + err.code + " (" + (names[err.code] || "?") + "): " + err.message +
      "<br>" + location.origin + " · secure=" + window.isSecureContext + "<br>" + navigator.userAgent + "</span>");
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  show("info", "📡 Getting your location… tap <b>Allow</b> if the phone asks.");
});
</script>
</body>
</html>
